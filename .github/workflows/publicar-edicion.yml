name: La Primera · Edición diaria

on:
  schedule:
    - cron: '30 3,4 * * *'
    - cron: '17 4,5 * * *'
    - cron: '43 5,6 * * *'
  workflow_dispatch:
    inputs:
      modo:
        description: Acción para esta ejecución
        type: choice
        options: [comprobar, publicar, republicar-edicion-revisada]
        default: comprobar

permissions:
  contents: read

concurrency:
  group: la-primera-pages
  cancel-in-progress: false

jobs:
  preparar:
    if: github.repository == 'AR-0A/la-primera' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      publicar: ${{ steps.edicion.outputs.publicar }}
    env:
      MODO: ${{ github.event_name == 'schedule' && 'publicar' || inputs.modo }}
      PORTADA: https://ar-0a.github.io/la-primera/
    steps:
      - name: Comprobar si falta la edición de hoy
        id: pendiente
        run: |
          if [[ "$GITHUB_EVENT_NAME" == schedule && "$(TZ=Europe/Madrid date +%H%M)" < '0530' ]]; then
            echo 'Aún no son las 05:30 en la España peninsular.'
            exit 0
          fi
          if [[ "$MODO" == publicar ]]; then
            destino="$RUNNER_TEMP/portada-previa.html"
            curl -fsS --retry 2 --max-time 20 -H 'Cache-Control: no-cache' \
              "$PORTADA?consulta=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-previa" -o "$destino"
            publicada=$(python3 - "$destino" <<'PY'
          import re
          import sys
          from datetime import date
          from pathlib import Path

          html = Path(sys.argv[1]).read_text(encoding='utf-8')
          match = re.search(r'<time class="fecha-dia" datetime="(\d{4}-\d{2}-\d{2})">', html)
          if not match:
              raise SystemExit('Falta una fecha de edición válida en la portada pública.')
          print(date.fromisoformat(match[1]).isoformat())
          PY
            )
            hoy=$(TZ=Europe/Madrid date +%F)
            if [[ "$publicada" > "$hoy" || "$publicada" == "$hoy" ]]; then
              echo "La portada ya muestra la edición del $publicada."
              exit 0
            fi
            echo "Falta la edición del $hoy. La portada actual es del $publicada."
          fi
          echo 'generar=true' >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        if: steps.pendiente.outputs.generar == 'true'
        with:
          persist-credentials: false

      - name: Recoger fuentes de la mañana
        if: steps.pendiente.outputs.generar == 'true' && inputs.modo != 'republicar-edicion-revisada'
        run: |
          mkdir editor
          unzip -q generador-la-primera.zip -d editor
          python3 editor/diario.py recoger

      - name: Iniciar el modelo local para el contraste
        if: steps.pendiente.outputs.generar == 'true' && inputs.modo != 'republicar-edicion-revisada'
        timeout-minutes: 10
        run: |
          esperar_ollama() {
            curl -fsS --retry 12 --retry-delay 2 --retry-all-errors --connect-timeout 2 --max-time 4 \
              http://127.0.0.1:11434/api/version
          }

          iniciar_nativo() {
            local carpeta="$RUNNER_TEMP/ollama" archivo="$RUNNER_TEMP/ollama.tar.zst"
            mkdir -p "$carpeta" || return 1
            timeout --kill-after=10s 210s curl -fsSL --retry 2 --retry-all-errors --connect-timeout 10 \
              https://github.com/ollama/ollama/releases/download/v0.40.18/ollama-linux-amd64.tar.zst \
              -o "$archivo" || return 1
            printf '%s  %s\n' 'b82649006cb5b54ed1237fa2d1a26a7f939a4fd03150033759acbff7ff315adf' "$archivo" \
              | sha256sum -c - || return 1
            tar --zstd -xf "$archivo" -C "$carpeta" || return 1
            [[ -x "$carpeta/bin/ollama" ]] || return 1
            nohup env OLLAMA_HOST=127.0.0.1:11434 OLLAMA_MODELS="$RUNNER_TEMP/modelos-ollama" \
              "$carpeta/bin/ollama" serve > "$RUNNER_TEMP/ollama.log" 2>&1 &
            local servicio=$!
            if ! esperar_ollama; then
              kill "$servicio" 2>/dev/null || true
              tail -n 20 "$RUNNER_TEMP/ollama.log"
              return 1
            fi
            cliente=("$carpeta/bin/ollama")
          }

          if ! iniciar_nativo; then
            echo 'El arranque con la versión oficial directa falló. Se prueba el contenedor.'
            imagen='ollama/ollama:0.40.18@sha256:1cabd20e1762a7a8444bf4a7110b346d923cd77ab6c97c984434140638c913ec'
            timeout --kill-after=10s 150s docker pull "$imagen"
            docker run --detach --rm --pull=never --name la-primera-ollama \
              --publish 127.0.0.1:11434:11434 "$imagen"
            esperar_ollama
            cliente=(docker exec la-primera-ollama ollama)
          fi
          timeout --kill-after=10s 220s "${cliente[@]}" pull qwen2.5:7b

      - name: Contrastar fuentes y preparar la portada
        id: edicion
        if: steps.pendiente.outputs.generar == 'true'
        run: |
          fecha_portada() {
            python3 - "$1" <<'PY'
          import re
          import sys
          from pathlib import Path

          page = Path(sys.argv[1]).read_text(encoding='utf-8')
          match = re.search(r'<time class="fecha-dia" datetime="(\d{4}-\d{2}-\d{2})">', page)
          if not match:
              raise SystemExit('Falta una fecha de edición válida.')
          print(match[1])
          PY
          }

          if [[ "$MODO" == republicar-edicion-revisada ]]; then
            curl -fsS --retry 3 --max-time 20 -H 'Cache-Control: no-cache' \
              "$PORTADA?consulta=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-final" -o "$RUNNER_TEMP/portada-publica.html"
            publicada=$(fecha_portada "$RUNNER_TEMP/portada-publica.html")
            inicial=$(fecha_portada index.html)
            hoy=$(TZ=Europe/Madrid date +%F)
            if [[ "$inicial" < "$publicada" || "$inicial" > "$hoy" ]]; then
              echo 'La edición preparada está fuera del intervalo de publicación. Se mantiene la portada.'
              exit 0
            fi
            mkdir publicacion
            cp -- index.html "$inicial.html" icon-192.png icon-512.png manifest.webmanifest sw.js publicacion/
            for imagen in ./*.jpg ./*.webp; do
              if [[ -f "$imagen" ]]; then
                cp -- "$imagen" publicacion/
              fi
            done
          else
            python3 editor/edicion_automatica.py editor/.local/????-??-??.json --generar
            if [[ ! -s editor/dist/index.html ]]; then
              echo 'Ninguna noticia superó el contraste. Se mantiene la última edición.'
              exit 0
            fi
            if [[ "$MODO" != publicar ]]; then
              echo 'Comprobación terminada. Se ha generado una portada con las noticias admitidas.'
              exit 0
            fi
            curl -fsS --retry 3 --max-time 20 -H 'Cache-Control: no-cache' \
              "$PORTADA?consulta=$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT-final" -o "$RUNNER_TEMP/portada-publica.html"
            publicada=$(fecha_portada "$RUNNER_TEMP/portada-publica.html")
            nueva=$(fecha_portada editor/dist/index.html)
            if [[ "$nueva" < "$publicada" || "$nueva" == "$publicada" ]]; then
              echo 'La web ya tiene una edición con esa fecha o posterior. Se mantiene.'
              exit 0
            fi
            mv -- editor/dist publicacion
          fi
          echo 'publicar=true' >> "$GITHUB_OUTPUT"

      - name: Entregar solo la web para su publicación
        if: steps.edicion.outputs.publicar == 'true'
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: publicacion
          retention-days: 1

  publicar:
    if: needs.preparar.outputs.publicar == 'true'
    needs: preparar
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.despliegue.outputs.page_url }}
    steps:
      - name: Publicar la portada en GitHub Pages
        id: despliegue
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
